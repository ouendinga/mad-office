services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: madoffice
      POSTGRES_USER: madoffice
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es requerida}
    volumes:
      - mad_office_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madoffice"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://madoffice:${DB_PASSWORD:?DB_PASSWORD es requerida}@postgres:5432/madoffice
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es requerida}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:3000}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?RUNNER_TOKEN es requerida}
      DAILY_CAP_USD: ${DAILY_CAP_USD:-0.25}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      CLOCK_SPEED: ${CLOCK_SPEED:-1}
      CLOCK_START: ${CLOCK_START:-}
      GATE: ${GATE:-off}
      GATE_INSECURE_COOKIE: ${GATE_INSECURE_COOKIE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${API_URL:-}
        REACT_APP_WS_URL: ${WS_URL:-}
    ports:
      - "127.0.0.1:${PORT:-8081}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mad_office_pgdata:
